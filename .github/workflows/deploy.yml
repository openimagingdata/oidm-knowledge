name: Deploy site (staging)

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/brand/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-quartz-npm-${{ hashFiles('site/build.sh', 'site/quartz.config.yaml', 'site/plugins/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-quartz-npm-
      - name: Check and build staging
        run: bash site/build.sh --target staging
      - name: Deploy to Cloudflare staging
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config site/wrangler.jsonc --env staging
      - name: Cloudflare deployment not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Staging build succeeded. Deployment skipped because Cloudflare secrets are unset."
