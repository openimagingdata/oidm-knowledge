# Where each Excalidraw figure is written and published.
#
# One table per figure, keyed by figure name. Builders look up their own
# `excalidraw` path here by name (excalib.figure()); render_excalidraw.py
# --figure <name> / --all renders `excalidraw` to `svg` and to a review PNG.
#
#   builder     builder script (repo-relative)
#   args        optional extra arguments the builder needs for this figure
#   excalidraw  where the builder writes the .excalidraw (repo-relative)
#   svg         where the rendered SVG goes (repo-relative); omit if the
#               figure has no published SVG
#
# All paths are relative to the repository root, not the working directory.

# Review PNGs always go here as <name>.png (ignored directory).
review_png_dir = "scratch/review/renders"

# ---------------------------------------------------------------- accepted

[two-planes]
builder = "tools/diagrams/build_two_planes.py"
excalidraw = "tools/diagrams/excalidraw/two-planes.excalidraw"
svg = "site/content/two-planes.svg"

[three-axes]
builder = "tools/diagrams/build_three_axes.py"
excalidraw = "tools/diagrams/excalidraw/three-axes.excalidraw"
svg = "site/content/foundation-context/three-axes.svg"

