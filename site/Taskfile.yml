# Site tasks are independent of the knowledge graph's validators.
version: "3"

vars:
  SITE_REPO_ROOT: '{{.TASKFILE_DIR}}/..'
  DEV_URL: '{{.DEV_URL | default "oidm-knowledge-dev.talkasab.workers.dev"}}'
  STAGING_URL: '{{.STAGING_URL | default "oidm-knowledge-staging.talkasab.workers.dev"}}'
  PROD_URL: '{{.PROD_URL | default "oidm-knowledge.talkasab.workers.dev"}}'

tasks:
  check:
    desc: Check site pages, links, and navigation
    dir: '{{.SITE_REPO_ROOT}}'
    cmds:
      - uv run site/tools/check_site.py {{.CLI_ARGS}}
  build:
    desc: Build the draft dev site into public/
    dir: '{{.SITE_REPO_ROOT}}'
    cmds:
      - bash site/build.sh {{.CLI_ARGS}}
  serve:
    desc: Serve the draft site with live reload
    dir: '{{.SITE_REPO_ROOT}}'
    cmds:
      - bash site/build.sh serve {{.CLI_ARGS}}
  preview:
    desc: Build and preview through Cloudflare's local static-asset server
    dir: '{{.SITE_REPO_ROOT}}'
    cmds:
      - bash site/build.sh
      - npx wrangler dev --config site/wrangler.jsonc --env dev
  verify:
    desc: 'Stamp reviewed pages: verify -- site/content/path.md [...]'
    dir: '{{.SITE_REPO_ROOT}}'
    cmds:
      - uv run site/tools/verify.py {{.CLI_ARGS}}
  review-status:
    desc: Show verified / total pages by top-level directory
    dir: '{{.SITE_REPO_ROOT}}'
    cmds:
      - uv run site/tools/verify.py --status
  review-list:
    desc: 'List unverified pages: review-list -- site/content/foundation-context'
    dir: '{{.SITE_REPO_ROOT}}'
    cmds:
      - uv run site/tools/verify.py --list {{.CLI_ARGS | default "site/content"}}
  deploy:
    desc: Build and deploy the draft dev site
    dir: '{{.SITE_REPO_ROOT}}'
    deps: [check]
    cmds:
      - SITE_BASE_URL='{{.DEV_URL}}' bash site/build.sh --target dev
      - npx wrangler deploy --config site/wrangler.jsonc --env dev
  deploy:staging:
    desc: Build and deploy the draft staging site
    dir: '{{.SITE_REPO_ROOT}}'
    deps: [check]
    cmds:
      - SITE_BASE_URL='{{.STAGING_URL}}' bash site/build.sh --target staging
      - npx wrangler deploy --config site/wrangler.jsonc --env staging
  deploy:prod:
    desc: Build and deploy reviewed pages to the public site
    dir: '{{.SITE_REPO_ROOT}}'
    deps: [check]
    cmds:
      - SITE_BASE_URL='{{.PROD_URL}}' bash site/build.sh --target production
      - npx wrangler deploy --config site/wrangler.jsonc
